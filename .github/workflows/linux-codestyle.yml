name: Check Codestyle

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get INDI 3rd Party Sources
        uses: actions/checkout@v4
        with:
          # HEAD is the merge of the pull request into its base, so HEAD^1 is the base.
          fetch-depth: 2

      - name: Install the astyle version pinned in .astyle-version
        run: |
          version=$(tr -d '[:space:]' < .astyle-version)
          pipx install "astyle==${version}" || python3 -m pip install --user --break-system-packages "astyle==${version}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Check codestyle of the changed lines in files with suffix cpp,cxx,c,h
        run: |
          astyle --version
          rc=0
          # Vendor SDK files (lib*) and retired drivers (obsolete) are not ours to format.
          while IFS= read -r file; do
            echo "changed file $file"
            scripts/check-codestyle.sh "$file" HEAD^1 || rc=1
          done < <(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- . ':(exclude)lib*' ':(exclude)obsolete')
          exit $rc
        shell: bash
